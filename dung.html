<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi Bạn 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.3;
        pointer-events: none;
        will-change: transform;
      }
      .g1 {
        width: 45vmax;
        height: 45vmax;
        background: #ff2d8a;
        left: -10vmax;
        top: -10vmax;
      }
      .g2 {
        width: 35vmax;
        height: 35vmax;
        background: #8a3dff;
        right: -10vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 2.5px;
        height: 2.5px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 0.85;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 0.6s,
          transform 0.6s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.94);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.8rem, 8vw, 3.8rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.4rem, 11vw, 5.2rem);
        color: var(--pink);
        text-shadow: 0 0 20px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.4s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.3);
        }
        100% {
          transform: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 10px var(--rose);
        will-change: transform;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.5rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.03);
        }
      }
      #btn,
      .b2 {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 20px rgba(255, 61, 132, 0.4);
        transition: transform 0.2s;
        z-index: 5;
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease-out;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: rgba(45, 14, 38, 0.78);
        border: 1px solid rgba(255, 182, 213, 0.35);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        transform: scale(0.92) translateY(18px);
        transition: transform 0.8s cubic-bezier(0.2, 1.1, 0.3, 1);
        will-change: transform;
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.4s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.2);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.15);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.88rem;
        line-height: 1.7;
        margin: 0 0.3rem;
        opacity: 0;
        transition: opacity 0.8s;
      }
      #msg.on {
        opacity: 1;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.55rem 0.45rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 182, 213, 0.2);
        opacity: 0;
        transform: translateY(12px);
        transition: all 0.5s ease-out;
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.1rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .heart {
        position: fixed;
        bottom: -40px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        will-change: transform;
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -110vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.7s ease-out forwards;
        will-change: transform;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>chạm vào màn hình để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <script>
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "BẠN",
        name: "Bạn",
        intro:
          "Nhân ngày 20/10, chúc Bạn luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
        wishes: [
          ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
          ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
          ["✨", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
          ["🌹", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."],
        ],
        quote:
          "Cảm ơn bạn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
        sign: "— Một người luôn nghĩ đến bạn 🌹",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXY0123456789";
      const rnd = (a) => a[Math.floor(Math.random() * a.length)];
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      for (let i = 0; i < 30; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("msg").textContent = CFG.intro;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = window.innerWidth,
        H = window.innerHeight,
        decoding = false,
        landed = 0,
        total = 0;

      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        for (let i = 0; i < 12; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(20, 38));
        }
        requestAnimationFrame(tick);
      }

      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? "1" : "0.5";
        e.style.color = rnd(["#ffb3d4", "#ff6fae", "#ffd9a8", "#fff"]);
        e.textContent = f.real ? f.c : rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-1.8, 1.8),
          vy: R(-1.8, 1.8),
          rot: R(0, 360),
          state: "fly",
        });
      }

      function tick() {
        let active = false;
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          active = true;
          if (f.state === "fly") {
            f.x += f.vx;
            f.y += f.vy;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
          } else if (f.state === "go") {
            const k = 0.12;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 2) land(f);
          }
          f.el.style.transform = `translate3d(${f.x}px,${f.y}px,0) translate(-50%,-50%) rotate(${f.rot}deg)`;
        });
        if (active) requestAnimationFrame(tick);
      }

      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          setTimeout(showCard, 1000);
        }
      }

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = 0;
                f.state = "go";
                f.el.textContent = f.c;
              },
              200 + i++ * 80,
            );
          } else {
            f.el.style.opacity = "0";
            setTimeout(() => {
              f.state = "done";
              if (f.el) f.el.remove();
            }, 600);
          }
        });
      }

      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });

      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size}px;color:#ffc2dc;--bx:${R(-50, 50)}px;--by:${R(-50, 50)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 700);
      }

      const HEARTS = ["❤", "💖", "🌸", "🌹"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(6, 10);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(18, 32)}px;animation-duration:${d}s;--dx:${R(-40, 40)}px;--rot:${R(-30, 30)}deg`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 600);

        setTimeout(() => $("msg").classList.add("on"), 400);
        setTimeout(() => {
          document
            .querySelectorAll(".w")
            .forEach((w, k) => setTimeout(() => w.classList.add("on"), k * 180));
        }, 800);
        setTimeout(() => $("quote").classList.add("on2"), 1700);
        setTimeout(() => $("sign").classList.add("on2"), 2100);
        setTimeout(() => ($("btns").style.opacity = "1"), 2500);
      }

      $("card").addEventListener("click", (e) => {
        for (let i = 0; i < 4; i++) {
          burst(e.clientX, e.clientY, rnd(HEARTS), 16);
        }
      });

      init();
    </script>
  </body>
</html>
