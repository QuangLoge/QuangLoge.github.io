<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20/10</title>
    <!-- Import font chữ xịn xò -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #03030b; /* Màu nền đen tuyền hơi xanh của vũ trụ */
            color: #fff;
            font-family: 'Courier Prime', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Bầu trời sao lấp lánh */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            z-index: 1;
            pointer-events: none;
        }
        .stars::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 60%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 70% 30%, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90% 80%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 30% 90%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50% 10%, #fff, rgba(0,0,0,0));
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Nút bắt đầu (ẩn sau khi bấm) */
        #start-screen {
            position: absolute;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #start-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Courier Prime', monospace;
            background-color: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #start-btn:hover {
            background-color: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff;
        }

        /* Nội dung chính */
        #main-content {
            display: none; /* Ẩn cho đến khi bấm nút */
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
        }

        /* 2 Khối vuông neon */
        .eyes-container {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }
        .eye {
            width: 50px;
            height: 50px;
            background-color: #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff, 0 0 50px #00f3ff;
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff; }
            50% { transform: scale(1.1); box-shadow: 0 0 25px #00f3ff, 0 0 50px #00f3ff, 0 0 70px #00f3ff; }
        }

        /* Chữ chạy */
        #lyrics {
            font-size: 22px;
            text-align: center;
            min-height: 60px;
            max-width: 90%;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        /* Ảnh nền mờ ảo xuất hiện sau */
        #bg-image {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60vh;
            object-fit: cover;
            object-position: bottom;
            opacity: 0;
            z-index: 2;
            transition: opacity 3s ease-in-out;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    
    <!-- Link ảnh cô gái (Bạn có thể đổi link khác) -->
    <img id="bg-image" src="https://i.pinimg.com/originals/59/54/b4/5954b408c66525ad932faa693a647e3f.jpg" alt="Art">

    <div id="start-screen">
        <button id="start-btn">Mở quà 20/10</button>
    </div>

    <div id="main-content">
        <div class="eyes-container">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div id="lyrics"></div>
    </div>

    <!-- AUDIO: Thay link nhạc MP3 của bạn vào đây -->
    <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mainContent = document.getElementById('main-content');
        const lyricsBox = document.getElementById('lyrics');
        const music = document.getElementById('bg-music');
        const bgImage = document.getElementById('bg-image');

        // Kịch bản lời bài hát và thời gian (tính bằng mili-giây: 1000 = 1 giây)
        const script = [
            { time: 1000, text: "Hôm nay tớ nhận lệnh từ Dr D là để..." },
            { time: 5000, text: "ui cậu đẹp quá" },
            { time: 8000, text: "à thì cũng sắp 20/10 rồi" },
            { time: 11000, text: "nên là tớ muốn..." },
            { time: 14000, text: "chúc cậu thật nhiều sức khỏe" },
            { time: 17000, text: "thật xinh đẹp" },
            { time: 20000, text: "và chúc cậu luôn giữ nụ cười trên môi" },
            { time: 24000, text: "vì mình có làm được đâu" },
            { time: 28000, text: "nhưng ai khác bên em là..." },
            { time: 31000, text: "nhường đi hết tất cả" }
        ];

        let typeInterval;

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            mainContent.style.display = 'flex';
            
            music.play();

            // Cho ảnh mờ từ từ hiện lên ở giây thứ 8
            setTimeout(() => {
                bgImage.style.opacity = '0.4';
            }, 8000);

            // Chạy kịch bản
            script.forEach(line => {
                setTimeout(() => {
                    typeWriter(line.text);
                }, line.time);
            });
        });

        function typeWriter(text) {
            clearInterval(typeInterval);
            lyricsBox.innerHTML = '';
            let i = 0;
            const speed = 70; // Tốc độ gõ chữ

            typeInterval = setInterval(() => {
                if (i < text.length) {
                    lyricsBox.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeInterval);
                }
            }, speed);
        }
    </script>
</body>
</html>
