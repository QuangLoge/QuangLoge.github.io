<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  
  <!-- FontAwesome để hiển thị các icon trong menu -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ================= BẦU TRỜI ĐÊM (Dành cho thẻ .night) ================= */
    .night {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #020111 10%, #20124d 90%);
      z-index: -1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff; }
    }

    /* ================= GIAO DIỆN CHÍNH (BIO CỦA ÔNG) ================= */
    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 24px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.6);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.8);
      margin-bottom: 30px;
    }

    /* ================= GIAO DIỆN MENU TỪ ẢNH ================= */
    .menu-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .menu-options.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .menu-option, .menu-trigger {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s ease;
    }

    .menu-trigger {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.6), rgba(13, 148, 136, 0.8));
      border-color: rgba(94, 234, 212, 0.8);
      font-size: 1.4rem;
    }

    .menu-option:hover, .menu-trigger:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- ĐOẠN CODE ÔNG YÊU CẦU TỪ ẢNH -->
  <audio id="bgMusic" loop src="./style/nhac.mp3"></audio>
  <audio id="popSound" src="./style/pop.mp3"></audio>
  <div class="night" id="nightSky"></div>

  <!-- NỘI DUNG TRANG BIO CỦA ÔNG -->
  <div class="container">
    <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my space ✨</p>
    <!-- Nếu muốn thêm nút Facebook, Tele... thì chèn vào đây -->
  </div>

  <!-- ĐOẠN MENU TỪ ẢNH -->
  <div class="menu-container">
    <div class="menu-options" id="menuOptions">
      <div class="menu-option" id="messageBtn" title="Lời nhắn">
        <i class="fa-regular fa-comment-dots"></i>
      </div>
      <div class="menu-option" id="giftBtn" title="Ảnh">
        <i class="fa-solid fa-gift"></i>
      </div>
      <div class="menu-option" id="musicBtn" title="Nhạc">
        <i class="fa-regular fa-circle-play"></i>
      </div>
      <div class="menu-option" id="settingsBtn" title="Icon">
        <i class="fa-regular fa-pen-to-square"></i>
      </div>
    </div>
    <div class="menu-trigger" id="menuTrigger">
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <script>
    // ================= XỬ LÝ MENU & ÂM THANH =================
    const menuTrigger = document.getElementById('menuTrigger');
    const menuOptions = document.getElementById('menuOptions');
    const popSound = document.getElementById('popSound');
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    // Mở / Đóng Menu
    menuTrigger.addEventListener('click', () => {
      menuOptions.classList.toggle('active');
      playPop();
    });

    // Phát âm thanh Pop
    function playPop() {
      if(popSound) {
        popSound.currentTime = 0;
        popSound.play().catch(e => console.log("Chưa có file pop.mp3"));
      }
    }

    // Bật / Tắt Nhạc Nền
    musicBtn.addEventListener('click', () => {
      playPop();
      if (bgMusic.paused) {
        bgMusic.play().catch(e => console.log("Chưa có file nhac.mp3"));
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      } else {
        bgMusic.pause();
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      }
    });

    // Bấm các nút khác cũng kêu tiếng Pop
    document.querySelectorAll('.menu-option').forEach(btn => {
      if(btn.id !== 'musicBtn') {
        btn.addEventListener('click', playPop);
      }
    });

    // ================= TẠO SAO CHO BẦU TRỜI ĐÊM =================
    const nightSky = document.getElementById('nightSky');
    const starsCount = 100;

    for (let i = 0; i < starsCount; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      
      // Random kích thước và vị trí sao
      let size = Math.random() * 3 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      
      // Random thời gian nhấp nháy
      star.style.animationDuration = `${Math.random() * 2 + 1}s`;
      star.style.animationDelay = `${Math.random() * 2}s`;
      
      nightSky.appendChild(star);
    }
  </script>
</body>
</html>
