<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #090a0f;
      color: #f0fdfa;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* === MÀN HÌNH START === */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-btn {
      padding: 18px 52px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(94, 234, 212, 0.15);
      border: 2px solid #5eead4;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(94, 234, 212, 0.4);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* === BẦU TRỜI ĐÊM VÀ SAO === */
    .night-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* === HẠT RƠI === */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* === NỘI DUNG BIO === */
    .main-wrapper {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
      pointer-events: none;
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 24px;
    }

    .main-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.7);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5);
      margin-bottom: 15px;
      animation: floatAvatar 4s ease-in-out infinite;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.8);
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .glass-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease;
    }

    .glass-btn:hover {
      background: rgba(94, 234, 212, 0.2);
      transform: translateY(-3px);
      border-color: rgba(94, 234, 212, 0.6);
    }

    /* === NÚT NHẠC === */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      border: 1px solid #99f6e4;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s, transform 0.2s ease;
    }

    .music-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
