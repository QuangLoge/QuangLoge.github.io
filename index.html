<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #090a0f;
      color: #f0fdfa;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* === MÀN HÌNH START === */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-btn {
      padding: 18px 55px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(94, 234, 212, 0.15);
      border: 2px solid #5eead4;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(94, 234, 212, 0.4);
      position: relative;
      z-index: 10000;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* === BẦU TRỜI ĐÊM VÀ SAO === */
    .night-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: 0;
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* === TUYẾT RƠI === */
    #sakura-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* === NỘI DUNG BIO === */
    .main-wrapper {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
      pointer-events: none;
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 24px;
    }

    .main-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.7);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5);
      margin-bottom: 15px;
      animation: floatAvatar 4s ease-in-out infinite;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.8);
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .glass-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease;
    }

    .glass-btn:hover {
      background: rgba(94, 234, 212, 0.2);
      transform: translateY(-3px);
      border-color: rgba(94, 234, 212, 0.6);
    }

    /* === NÚT NHẠC === */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2dd4bf, #0d9488);
      border: 1px solid #99f6e4;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
    }

    .music-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- 1. MÀN HÌNH START -->
  <div id="intro-screen">
    <button type="button" class="start-btn" onclick="batDau()">START</button>
  </div>

  <!-- FILE NHẠC (Up file noel.mp3 lên GitHub cùng chỗ với index.html) -->
  <audio id="bgMusic" src="./noel.mp3" loop preload="none"></audio>

  <!-- 2. NỀN ĐÊM + SAO -->
  <div class="night-bg" id="stars-container"></div>
  <canvas id="sakura-canvas"></canvas>

  <!-- 3. NỘI DUNG BIO -->
  <div class="main-wrapper" id="mainWrapper">
    <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my space ✨</p>
    
    <div class="links">
      <a href="https://www.facebook.com/toilaquang0/" target="_blank" class="glass-btn">Facebook</a>
      <a href="https://t.me/concacbulon" target="_blank" class="glass-btn">Telegram</a>
      <a href="https://www.tiktok.com/@toilaquang08" target="_blank" class="glass-btn">TikTok</a>
    </div>
  </div>

  <!-- 4. NÚT NHẠC -->
  <div class="music-btn" id="musicBtn" onclick="batTatNhac()" title="Bật/Tắt nhạc">
    <i class="fa-regular fa-circle-pause"></i>
  </div>

  <script>
    function batDau() {
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('mainWrapper').classList.add('visible');
      document.getElementById('musicBtn').classList.add('visible');

      var audio = document.getElementById('bgMusic');
      var btn = document.getElementById('musicBtn');
      audio.volume = 0.8;
      audio.play().then(function() {
        btn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      }).catch(function() {
        btn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      });
    }

    function batTatNhac() {
      var audio = document.getElementById('bgMusic');
      var btn = document.getElementById('musicBtn');
      if (audio.paused) {
        audio.play().catch(function() {});
        btn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      } else {
        audio.pause();
        btn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      }
    }

    // Tạo sao
    var starsContainer = document.getElementById('stars-container');
    for (var i = 0; i < 80; i++) {
      var star = document.createElement('div');
      star.className = 'star';
      var size = (Math.random() * 2.5 + 1) + 'px';
      star.style.width = size;
      star.style.height = size;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }

    var ctx = canvas.getContext('2d');
    var width = canvas.width = window.innerWidth;
    var height = canvas.height = window.innerHeight;

    window.addEventListener('resize', function() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    var particles = [];
    for (var j = 0; j < 45; j++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3 + 1.5,
        speedY: Math.random() * 1 + 0.4,
        speedX: Math.random() * 0.8 - 0.4,
        alpha: Math.random() * 0.5 + 0.3
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      for (var k = 0; k < particles.length; k++) {
        var p = particles[k];
        ctx.fillStyle = 'rgba(255, 255, 255, ' + p.alpha + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
