<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Space</title>
  <!-- Thêm thư viện FontAwesome để hiện các icon menu -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(-45deg, #090a0f, #1b2735, #0d1b2a, #031414);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= MÀN HÌNH CHÀO ĐẦU TRANG (INTRO) ================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, rgba(13, 27, 42, 0.85) 0%, rgba(3, 10, 15, 0.98) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.8s ease, visibility 0.8s ease, transform 0.8s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.08);
      pointer-events: none;
    }

    .intro-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.6);
      box-shadow: 0 0 30px rgba(45, 212, 191, 0.4);
      margin-bottom: 18px;
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 15px rgba(45, 212, 191, 0.3); }
      to { box-shadow: 0 0 35px rgba(45, 212, 191, 0.75); }
    }

    .intro-title {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .intro-sub {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.7);
      margin-bottom: 32px;
    }

    .enter-btn {
      padding: 15px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(13, 148, 136, 0.4));
      border: 1px solid rgba(94, 234, 212, 0.6);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .enter-btn:hover, .enter-btn:active {
      transform: translateY(-3px) scale(1.04);
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.4), rgba(13, 148, 136, 0.6));
      box-shadow: 0 15px 35px rgba(45, 212, 191, 0.6);
    }

    /* ================= NỘI DUNG CHÍNH & MENU CỦA ÔNG ================= */
    .night {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #sakura-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .main-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }

    .main-content.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Nút Menu nổi góc dưới phải (hoặc tùy chỉnh vị trí) */
    .menu-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(15px) scale(0.9);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .menu-options.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .menu-option, .menu-trigger {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(94, 234, 212, 0.35);
      color: #f0fdfa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .menu-option:hover, .menu-trigger:hover {
      background: rgba(45, 212, 191, 0.25);
      border-color: rgba(94, 234, 212, 0.8);
      transform: scale(1.08);
    }

    .menu-trigger {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.3), rgba(13, 148, 136, 0.4));
    }
  </style>
</head>
<body>

  <!-- 1. MÀN HÌNH ĐẦU TRANG (HIỆN RA TRƯỚC TIÊN) -->
  <div id="intro-screen">
    <img src="https://github.com/QuangLoge.png" alt="Avatar" class="intro-avatar">
    <h1 class="intro-title">Lê Hữu Quang</h1>
    <p class="intro-sub">Chạm để bước vào không gian của tôi ✨</p>
    <button class="enter-btn" id="enterBtn">
      <span>Khám phá ngay</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- 2. NỀN & HIỆU ỨNG -->
  <div class="night"></div>
  <canvas id="sakura-canvas"></canvas>

  <!-- ÂM THANH (Đã sửa chuẩn cú pháp) -->
  <audio id="bgMusic" loop src="./style/nhac.mp3"></audio>
  <audio id="popSound" src="./style/pop.mp3"></audio>

  <!-- 3. GIAO DIỆN CHÍNH SAU KHI BẤM VÀO ĐẦU TRANG -->
  <div class="main-content" id="mainContent">
    <h2>Welcome to my space ✨</h2>
    <p style="margin-top: 8px; opacity: 0.75;">(Nơi chứa nội dung chính / hiệu ứng của ông)</p>
  </div>

  <!-- 4. MENU CỦA ÔNG (ĐÃ SỬA LỖI CÚ PHÁP) -->
  <div class="menu-container">
    <div class="menu-options" id="menuOptions">
      <div class="menu-option" id="messageBtn" title="Lời nhắn">
        <i class="fa-regular fa-comment-dots"></i>
      </div>
      <div class="menu-option" id="giftBtn" title="Ảnh">
        <i class="fa-solid fa-gift"></i>
      </div>
      <div class="menu-option" id="musicBtn" title="Nhạc">
        <i class="fa-regular fa-circle-pause"></i>
      </div>
      <div class="menu-option" id="settingsBtn" title="Icon">
        <i class="fa-regular fa-pen-to-square"></i>
      </div>
    </div>
    <div class="menu-trigger" id="menuTrigger">
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const enterBtn = document.getElementById('enterBtn');
    const mainContent = document.getElementById('mainContent');
    const bgMusic = document.getElementById('bgMusic');
    const popSound = document.getElementById('popSound');
    const menuTrigger = document.getElementById('menuTrigger');
    const menuOptions = document.getElementById('menuOptions');
    const musicBtn = document.getElementById('musicBtn');

    // Hàm phát tiếng pop khi bấm nút
    function playPop() {
      if (popSound) {
        popSound.currentTime = 0;
        popSound.play().catch(() => {});
      }
    }

    // Xử lý khi bấm nút ở Đầu Trang -> Ẩn Intro, hiện trang chính & bật nhạc
    enterBtn.addEventListener('click', () => {
      playPop();
      introScreen.classList.add('hidden');
      mainContent.classList.add('visible');

      bgMusic.play().then(() => {
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      }).catch(() => {
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      });
    });

    // Đóng / Mở Menu
    menuTrigger.addEventListener('click', () => {
      playPop();
      menuOptions.classList.toggle('active');
    });

    // Bật / Tắt Nhạc trong Menu
    musicBtn.addEventListener('click', () => {
      playPop();
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      } else {
        bgMusic.pause();
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      }
    });

    // Phát tiếng pop cho các nút còn lại trong menu
    document.querySelectorAll('.menu-option').forEach(btn => {
      if (btn.id !== 'musicBtn') {
        btn.addEventListener('click', playPop);
      }
    });

    /* =================== HIỆU ỨNG CÁNH HOA RƠI =================== */
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const petals = Array.from({ length: 35 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 4 + 3,
      speedY: Math.random() * 1.2 + 0.8,
      speedX: Math.random() * 1 - 0.5
    }));

    function drawPetals() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      petals.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > height) p.y = -10;
        if (p.x > width) p.x = 0;
        if (p.x < 0) p.x = width;
      });
      requestAnimationFrame(drawPetals);
    }
    drawPetals();
  </script>
</body>
</html>
