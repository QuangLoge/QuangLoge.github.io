<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lê Hữu Quang - Bio Link</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #090a0f; color: #f0fdfa; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
#intro { position: fixed; inset: 0; z-index: 9999; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1b2735 0%, #090a0f 100%); transition: opacity 0.5s ease; }
#intro.hide { opacity: 0; pointer-events: none; }
.btn-start { padding: 18px 55px; font-size: 1.2rem; font-weight: 700; letter-spacing: 3px; color: #fff; background: rgba(94, 234, 212, 0.15); border: 2px solid #5eead4; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(94, 234, 212, 0.4); }
.btn-start:hover { background: rgba(94, 234, 212, 0.3); transform: scale(1.05); }
.bg { position: fixed; inset: 0; background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); z-index: 0; }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle infinite alternate ease-in-out; }
@keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.2); } }
#canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.card { opacity: 0; transform: translateY(20px); transition: all 0.8s ease; width: 100%; max-width: 390px; text-align: center; position: relative; z-index: 10; padding: 24px; pointer-events: none; }
.card.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.avatar { width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(94, 234, 212, 0.7); object-fit: cover; box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5); margin-bottom: 15px; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
h1 { font-size: 1.65rem; font-weight: 700; margin-bottom: 6px; }
p.bio { font-size: 0.95rem; color: rgba(204, 251, 241, 0.8); margin-bottom: 25px; }
.links { display: flex; flex-direction: column; gap: 15px; }
.link-btn { display: flex; align-items: center; justify-content: center; padding: 16px 20px; border-radius: 20px; text-decoration: none; font-weight: 600; color: #fff; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); transition: 0.25s; }
.link-btn:hover { background: rgba(94, 234, 212, 0.2); transform: translateY(-3px); border-color: rgba(94, 234, 212, 0.6); }
.music-btn { position: fixed; bottom: 25px; right: 25px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #2dd4bf, #0d9488); border: 1px solid #99f6e4; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
.music-btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="intro">
  <button type="button" class="btn-start" id="startBtn">START</button>
</div>

<audio id="bgMusic" src="./noel.mp3" loop preload="none"></audio>

<div class="bg" id="stars"></div>
<canvas id="canvas"></canvas>

<div class="card" id="card">
  <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
  <h1>Lê Hữu Quang</h1>
  <p class="bio">Welcome to my space ✨</p>
  <div class="links">
    <a href="https://www.facebook.com/toilaquang0/" target="_blank" class="link-btn">Facebook</a>
    <a href="https://t.me/concacbulon" target="_blank" class="link-btn">Telegram</a>
    <a href="https://www.tiktok.com/@toilaquang08" target="_blank" class="link-btn">TikTok</a>
  </div>
</div>

<div class="music-btn" id="musicBtn"><i class="fa-regular fa-circle-pause"></i></div>

<script>
const intro = document.getElementById('intro');
const startBtn = document.getElementById('startBtn');
const card = document.getElementById('card');
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');

startBtn.onclick = function() {
  intro.classList.add('hide');
  setTimeout(function() { intro.style.display = 'none'; }, 500);
  card.classList.add('show');
  musicBtn.classList.add('show');
  bgMusic.volume = 0.8;
  bgMusic.play().then(function() {
    musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
  }).catch(function() {
    musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
  });
};

musicBtn.onclick = function() {
  if (bgMusic.paused) {
    bgMusic.play();
    musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
  } else {
    bgMusic.pause();
    musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
  }
};

const stars = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = (Math.random() * 2.5 + 1) + 'px';
  s.style.width = sz;
  s.style.height = sz;
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
  stars.appendChild(s);
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.onresize = function() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };

const pts = Array.from({ length: 45 }, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  r: Math.random() * 3 + 1.5,
  sy: Math.random() * 1 + 0.4,
  sx: Math.random() * 0.8 - 0.4,
  a: Math.random() * 0.5 + 0.3
}));

function loop() {
  ctx.clearRect(0, 0, w, h);
  for (const p of pts) {
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.y += p.sy;
    p.x += p.sx;
    if (p.y > h) p.y = -10;
    if (p.x > w) p.x = 0;
    if (p.x < 0) p.x = w;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
