<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
    .container { width: 100%; max-width: 420px; text-align: center; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #38bdf8; object-fit: cover; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    p.bio { font-size: 0.95rem; color: #94a3b8; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn { display: flex; align-items: center; justify-content: center; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; color: #ffffff; background: #1e293b; border: 1px solid #334155; transition: 0.2s; }
    .link-btn:hover { border-color: #38bdf8; background: #334155; }
    .section-title { text-align: left; font-size: 0.85rem; text-transform: uppercase; color: #64748b; margin-top: 10px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my profile ✨</p>
    <div class="links">
      <div class="section-title">Mạng xã hội</div>
      <a href="https://facebook.com" target="_blank" class="link-btn">Facebook</a>
      <a href="https://instagram.com" target="_blank" class="link-btn">Instagram</a>
      <a href="https://tiktok.com" target="_blank" class="link-btn">TikTok</a>

      <div class="section-title">Âm nhạc</div>
      <a href="https://spotify.com" target="_blank" class="link-btn">Spotify</a>
      <a href="https://soundcloud.com" target="_blank" class="link-btn">SoundCloud</a>
    </div>
  </div>
</body>
</html>
