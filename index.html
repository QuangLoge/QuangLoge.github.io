<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  
  <!-- FontAwesome icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020111; /* Đen xanh đêm */
      color: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* === LỚP 1: BẦU TRỜI ĐÊM VÀ SAO === */
    .night-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
    }

    /* === LỚP 2: HIỆU ỨNG HOA RƠI === */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* === LỚP 3: NỘI DUNG BIO CỦA ÔNG === */
    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 24px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.6);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5);
      margin-bottom: 15px;
      animation: floatAvatar 4s ease-in-out infinite;
    }

    @keyframes floatAvatar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.75);
      margin-bottom: 25px;
    }

    /* Các nút link trong suốt */
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .glass-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
      border-color: rgba(94, 234, 212, 0.5);
    }

    /* === LỚP 4: MENU GÓC DƯỚI TỪ ẢNH === */
    .menu-container {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.8);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .menu-options.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .menu-option, .menu-trigger {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-trigger {
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.6), rgba(13, 148, 136, 0.8));
      border-color: rgba(94, 234, 212, 0.8);
    }

    .menu-option:hover, .menu-trigger:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Audio -->
  <audio id="bgMusic" loop src="./style/nhac.mp3"></audio>
  <audio id="popSound" src="./style/pop.mp3"></audio>

  <!-- Lớp nền Đêm + Sao -->
  <div class="night-bg" id="stars-container"></div>
  
  <!-- Lớp Hoa rơi -->
  <canvas id="sakura-canvas"></canvas>

  <!-- Lớp Nội dung chính -->
  <div class="container">
    <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my space ✨</p>
    
    <div class="links">
      <a href="https://www.facebook.com/toilaquang0/" target="_blank" class="glass-btn">Facebook</a>
      <a href="https://t.me/concacbulon" target="_blank" class="glass-btn">Telegram</a>
      <a href="https://www.tiktok.com/@toilaquang08" target="_blank" class="glass-btn">TikTok</a>
    </div>
  </div>

  <!-- Lớp Menu -->
  <div class="menu-container">
    <div class="menu-options" id="menuOptions">
      <div class="menu-option" id="messageBtn" title="Lời nhắn"><i class="fa-regular fa-comment-dots"></i></div>
      <div class="menu-option" id="giftBtn" title="Ảnh"><i class="fa-solid fa-gift"></i></div>
      <div class="menu-option" id="musicBtn" title="Nhạc"><i class="fa-regular fa-circle-play"></i></div>
      <div class="menu-option" id="settingsBtn" title="Cài đặt"><i class="fa-regular fa-pen-to-square"></i></div>
    </div>
    <div class="menu-trigger" id="menuTrigger">
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <script>
    // 1. TẠO SAO TRÊN BẦU TRỜI
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 80; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = (Math.random() * 3 + 1) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }

    // 2. HIỆU ỨNG CÁNH HOA / TUYẾT RƠI
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3 + 2,
      speedY: Math.random() * 1 + 0.5,
      speedX: Math.random() * 1 - 0.5,
      alpha: Math.random() * 0.5 + 0.3
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > height) p.y = -10;
        if (p.x > width) p.x = 0;
        if (p.x < 0) p.x = width;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // 3. XỬ LÝ MENU & ÂM THANH
    const menuTrigger = document.getElementById('menuTrigger');
    const menuOptions = document.getElementById('menuOptions');
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const popSound = document.getElementById('popSound');

    function playPop() {
      if(popSound) {
        popSound.currentTime = 0;
        popSound.play().catch(()=>{});
      }
    }

    menuTrigger.addEventListener('click', () => {
      menuOptions.classList.toggle('active');
      playPop();
    });

    musicBtn.addEventListener('click', () => {
      playPop();
      if (bgMusic.paused) {
        bgMusic.play().catch(()=>{});
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-pause"></i>';
      } else {
        bgMusic.pause();
        musicBtn.innerHTML = '<i class="fa-regular fa-circle-play"></i>';
      }
    });

    document.querySelectorAll('.menu-option').forEach(btn => {
      if(btn.id !== 'musicBtn') btn.addEventListener('click', playPop);
    });
  </script>
</body>
</html>
