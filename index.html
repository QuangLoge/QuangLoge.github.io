<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Đốm sáng chuyển động khúc xạ cho Liquid Glass */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.65;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: floatBlobs 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #38bdf8, #0284c7);
      top: 10%;
      left: 15%;
    }

    .blob-2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #f43f5e, #ec4899);
      bottom: 15%;
      right: 10%;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #818cf8, #6366f1);
      top: 50%;
      left: 40%;
      animation-delay: -8s;
    }

    @keyframes floatBlobs {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.15); }
      100% { transform: translate(-30px, -30px) scale(0.95); }
    }

    /* Canvas Hoa anh đào rơi liên tục */
    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Nút Đĩa Nhạc Xoay */
    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .music-control:active {
      transform: scale(0.9);
    }

    .music-control.playing {
      animation: rotateVinyl 4s linear infinite;
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Hiệu ứng xuất hiện */
    @keyframes springIn {
      0% {
        opacity: 0;
        transform: translateY(45px) scale(0.92);
      }
      70% {
        opacity: 1;
        transform: translateY(-4px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .avatar-wrapper {
      display: inline-block;
      position: relative;
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.1s;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.45);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar:hover {
      transform: scale(1.08) rotate(2deg);
    }

    h1 {
      font-size: 1.65rem;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.25s;
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.4s;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Hiệu ứng LIQUID GLASS */
    .liquid-glass-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      color: #ffffff;
      
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -2px 8px rgba(0, 0, 0, 0.2);
      
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .liquid-glass-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -80%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        60deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.12) 30%, 
        rgba(255, 255, 255, 0.35) 50%, 
        rgba(255, 255, 255, 0.12) 70%, 
        transparent 100%
      );
      transform: rotate(25deg);
      animation: liquidSheen 4.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes liquidSheen {
      0% { left: -80%; }
      35% { left: 140%; }
      100% { left: 140%; }
    }

    .btn-fb {
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.55s;
    }

    .btn-tele {
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.7s;
    }

    .liquid-glass-btn:hover, .liquid-glass-btn:active {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 15px 35px rgba(56, 189, 248, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -2px 10px rgba(56, 189, 248, 0.3);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.05) 100%);
    }

    /* =================== REM CHIBI ANIME =================== */
    .rem-wrapper {
      position: fixed;
      bottom: 10px;
      right: 14px;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
      user-select: none;
    }

    .rem-dialog {
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #e0f2fe;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      margin-bottom: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(56, 189, 248, 0.3);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .rem-dialog.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .rem-dialog::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 32px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: rgba(15, 23, 42, 0.92) transparent;
    }

    .rem-character {
      width: 95px;
      position: relative;
      animation: remFloat 3s ease-in-out infinite;
      transform-origin: bottom center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .rem-character.bounce {
      animation: remJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes remFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    @keyframes remJump {
      0% { transform: scale(1) translateY(0); }
      40% { transform: scale(0.9, 1.15) translateY(-28px); }
      70% { transform: scale(1.08, 0.92) translateY(2px); }
      100% { transform: scale(1) translateY(0); }
    }

    .rem-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
      pointer-events: none;
    }

    .heart-float {
      position: absolute;
      font-size: 1.2rem;
      pointer-events: none;
      animation: heartFly 0.8s ease-out forwards;
    }

    @keyframes heartFly {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <canvas id="sakura-canvas"></canvas>

  <div class="music-control" id="musicBtn" onclick="toggleAudio()">
    🎵
  </div>

  <!-- Nhạc nền Lofi -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="avatar-wrapper">
      <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    </div>

    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my space ✨</p>

    <div class="links">
      <a href="https://www.facebook.com/toilaquang0/" target="_blank" class="liquid-glass-btn btn-fb">
        <span>Facebook</span>
      </a>

      <a href="https://t.me/concacbulon" target="_blank" class="liquid-glass-btn btn-tele">
        <span>Telegram</span>
      </a>
    </div>
  </div>

  <!-- REM CHIBI -->
  <div class="rem-wrapper" id="remWrapper" onclick="interactRem(event)">
    <div class="rem-dialog" id="remDialog">ゼロから始めましょう！✨</div>
    <div class="rem-character" id="remChar">
      <!-- File ảnh bạn đã upload lên repo -->
      <img src="IMG_0436.jpeg" alt="Rem Chibi" class="rem-img">
    </div>
  </div>

  <script>
    /* =================== ÂM THANH & GIỌNG NÓI REM =================== */
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let hasInteracted = false;
    let normalVolume = 0.7; // Âm lượng nhạc bình thường
    let duckedVolume = 0.15; // Âm lượng nhạc khi Rem nói (nhỏ lại)

    audio.volume = normalVolume;

    function playAudio() {
      audio.play().then(() => {
        musicBtn.classList.add('playing');
        musicBtn.innerHTML = '🔊';
      }).catch(() => {});
    }

    function toggleAudio() {
      if (audio.paused) {
        playAudio();
      } else {
        audio.pause();
        musicBtn.classList.remove('playing');
        musicBtn.innerHTML = '🔇';
      }
    }

    document.addEventListener('touchstart', function() {
      if (!hasInteracted) {
        playAudio();
        hasInteracted = true;
      }
    }, { once: true });

    document.addEventListener('click', function() {
      if (!hasInteracted) {
        playAudio();
        hasInteracted = true;
      }
    }, { once: true });

    /* =================== TƯƠNG TÁC & GIỌNG NÓI ANIME =================== */
    const remQuotes = [
      { text: "ここから、始めましょう。ゼロから！✨", speak: "ここから、始めましょう。ゼロから！" },
      { text: "レムは、スバルくんを愛しています 💙", speak: "レムは、スバルくんを愛しています。" },
      { text: "スバルくんは、レムの英雄なんです！💖", speak: "スバルくんは、レムの英雄なんです！" },
      { text: "鬼がかってますね！🌸", speak: "鬼がかってますね！" },
      { text: "言質、とりました！(//▽//)", speak: "言質、とりました！" },
      { text: "はい！レムにお任せください ✨", speak: "はい！レムにお任せください。" },
      { text: "諦めるのは、簡単です。", speak: "諦めるのは、簡単です。" }
    ];

    let quoteTimeout = null;

    function interactRem(e) {
      const remChar = document.getElementById('remChar');
      const remDialog = document.getElementById('remDialog');
      const remWrapper = document.getElementById('remWrapper');

      // Nhảy cẫng lên
      remChar.classList.remove('bounce');
      void remChar.offsetWidth;
      remChar.classList.add('bounce');

      // Tạo icon tim bay
      const heart = document.createElement('span');
      heart.className = 'heart-float';
      const icons = ['💙', '✨', '🌸', '💖'];
      heart.innerText = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = (Math.random() * 40 + 20) + 'px';
      heart.style.top = '10px';
      remWrapper.appendChild(heart);
      setTimeout(() => heart.remove(), 800);

      // Chọn câu thoại
      const quoteObj = remQuotes[Math.floor(Math.random() * remQuotes.length)];
      remDialog.innerText = quoteObj.text;
      remDialog.classList.add('show');

      clearTimeout(quoteTimeout);
      quoteTimeout = setTimeout(() => {
        remDialog.classList.remove('show');
      }, 3000);

      // PHÁT GIỌNG NÓI TIẾNG NHẬT VÀ TỰ ĐỘNG GIẢM NHẠC NỀN
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Dừng câu trước nếu còn đang nói

        // Giảm nhạc nền xuống nhỏ để nghe rõ giọng Rem
        if (!audio.paused) {
          audio.volume = duckedVolume;
        }

        const utterance = new SpeechSynthesisUtterance(quoteObj.speak);
        utterance.lang = 'ja-JP'; // Giọng tiếng Nhật
        utterance.pitch = 1.6;    // Tone giọng nữ cao, trong trẻo anime cute
        utterance.rate = 1.05;    // Tốc độ nói tự nhiên

        // Khi Rem nói xong -> Nhạc nền tự to trở lại như cũ
        utterance.onend = function() {
          if (!audio.paused) {
            audio.volume = normalVolume;
          }
        };

        utterance.onerror = function() {
          if (!audio.paused) {
            audio.volume = normalVolume;
          }
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    /* =================== HOA ANH ĐÀO RƠI LIÊN TỤC =================== */
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const petalCount = 35;
    const petals = [];

    class Petal {
      constructor() {
        this.reset(true);
      }

      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : -20;
        this.size = Math.random() * 9 + 8;
        this.speedY = Math.random() * 1.4 + 1.1;
        this.speedX = Math.random() * 1.5 - 0.75;
        this.angle = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 1.8;
        this.flip = Math.random();
        this.flipSpeed = Math.random() * 0.02 + 0.01;
        this.color = Math.random() > 0.4 ? 'rgba(255, 183, 197, ' : 'rgba(255, 218, 224, ';
        this.alpha = Math.random() * 0.4 + 0.55;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.008) * 0.7;
        this.angle += this.spin;
        this.flip += this.flipSpeed;

        if (this.y > height + 25 || this.x < -30 || this.x > width + 30) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.angle * Math.PI) / 180);
        ctx.scale(1, Math.sin(this.flip));

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size / 2, -this.size / 2, -this.size, this.size / 3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size / 3, this.size / 2, -this.size / 2, 0, 0);
        ctx.fillStyle = this.color + this.alpha + ')';
        ctx.shadowColor = 'rgba(255, 183, 197, 0.4)';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < petalCount; i++) {
      petals.push(new Petal());
    }

    function animateSakura() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animateSakura);
    }

    animateSakura();
  </script>

</body>
</html>
