<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lê Hữu Quang - Bio Link</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #031414;
      color: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      filter: blur(85px);
      opacity: 0.7;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: floatBlobs 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #059669, #064e3b);
      top: 8%;
      left: 10%;
    }

    .blob-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #0d9488, #134e4a);
      bottom: 12%;
      right: 8%;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #0f766e, #022c22);
      top: 48%;
      left: 38%;
      animation-delay: -8s;
    }

    @keyframes floatBlobs {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, 45px) scale(1.18); }
      100% { transform: translate(-35px, -30px) scale(0.95); }
    }

    #sakura-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(45, 212, 191, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .music-control:active {
      transform: scale(0.9);
    }

    .music-control.playing {
      animation: rotateVinyl 4s linear infinite;
      border-color: rgba(45, 212, 191, 0.8);
      box-shadow: 0 0 22px rgba(20, 184, 166, 0.5);
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes springIn {
      0% {
        opacity: 0;
        transform: translateY(45px) scale(0.92);
      }
      70% {
        opacity: 1;
        transform: translateY(-4px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .avatar-wrapper {
      display: inline-block;
      position: relative;
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.1s;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(94, 234, 212, 0.6);
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.5);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar:hover {
      transform: scale(1.08) rotate(2deg);
    }

    h1 {
      font-size: 1.65rem;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.25s;
    }

    p.bio {
      font-size: 0.95rem;
      color: rgba(204, 251, 241, 0.75);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.4s;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .liquid-glass-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(13, 148, 136, 0.08) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(94, 234, 212, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        inset 0 -2px 8px rgba(4, 47, 46, 0.3);
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .liquid-glass-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -80%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        60deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.12) 30%, 
        rgba(255, 255, 255, 0.4) 50%, 
        rgba(255, 255, 255, 0.12) 70%, 
        transparent 100%
      );
      transform: rotate(25deg);
      animation: liquidSheen 4.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes liquidSheen {
      0% { left: -80%; }
      35% { left: 140%; }
      100% { left: 140%; }
    }

    .btn-fb {
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.55s;
    }

    .btn-tele {
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.7s;
    }

    .btn-tiktok {
      animation: springIn 1s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards;
      animation-delay: 0.85s;
    }

    .liquid-glass-btn:hover, .liquid-glass-btn:active {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(94, 234, 212, 0.7);
      box-shadow: 
        0 15px 35px rgba(13, 148, 136, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -2px 10px rgba(13, 148, 136, 0.4);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(20, 184, 166, 0.15) 100%);
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <canvas id="sakura-canvas"></canvas>

  <div class="music-control" id="musicBtn">🎵</div>

  <!-- Hỗ trợ cả 2 tên file thường gặp khi bạn tải về -->
  <audio id="bgMusic" loop preload="auto" playsinline webkit-playsinline>
    <source src="music.mp3.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="avatar-wrapper">
      <img src="https://github.com/QuangLoge.png" alt="Avatar" class="avatar">
    </div>

    <h1>Lê Hữu Quang</h1>
    <p class="bio">Welcome to my space ✨</p>

    <div class="links">
      <a href="https://www.facebook.com/toilaquang0/" target="_blank" class="liquid-glass-btn btn-fb">
        <span>Facebook</span>
      </a>

      <a href="https://t.me/concacbulon" target="_blank" class="liquid-glass-btn btn-tele">
        <span>Telegram</span>
      </a>

      <a href="https://www.tiktok.com/@toilaquang08" target="_blank" class="liquid-glass-btn btn-tiktok">
        <span>TikTok</span>
      </a>
    </div>
  </div>

  <script>
    /* =================== XỬ LÝ ÂM THANH =================== */
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let hasInteracted = false;

    function startPlaying() {
      audio.play().then(() => {
        musicBtn.classList.add('playing');
        musicBtn.innerHTML = '🔊';
      }).catch((err) => {
        console.log("Lỗi tải/phát âm thanh:", err);
        musicBtn.classList.remove('playing');
        musicBtn.innerHTML = '🔇';
      });
    }

    function stopPlaying() {
      audio.pause();
      musicBtn.classList.remove('playing');
      musicBtn.innerHTML = '🔇';
    }

    function handleMusicBtn(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      hasInteracted = true;

      if (audio.paused) {
        startPlaying();
      } else {
        stopPlaying();
      }
    }

    musicBtn.addEventListener('click', handleMusicBtn);
    musicBtn.addEventListener('touchend', handleMusicBtn);

    function firstUserInteraction(e) {
      if (musicBtn.contains(e.target)) return;

      if (!hasInteracted) {
        startPlaying();
        hasInteracted = true;
      }

      window.removeEventListener('touchstart', firstUserInteraction);
      window.removeEventListener('click', firstUserInteraction);
    }

    window.addEventListener('touchstart', firstUserInteraction, { passive: true });
    window.addEventListener('click', firstUserInteraction);

    /* =================== CÁNH HOA RƠI =================== */
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const petalCount = 38;
    const petals = [];

    class Petal {
      constructor() {
        this.reset(true);
      }

      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : -20;
        this.length = Math.random() * 8 + 10;
        this.width = this.length * (Math.random() * 0.2 + 0.45);
        this.speedY = Math.random() * 1.3 + 0.9;
        this.speedX = Math.random() * 1.4 - 0.7;
        this.angle = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 1.6;
        this.flip = Math.random();
        this.flipSpeed = Math.random() * 0.025 + 0.015;
        this.color = Math.random() > 0.3 ? 'rgba(255, 255, 255, ' : 'rgba(240, 253, 250, ';
        this.alpha = Math.random() * 0.4 + 0.5;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.007) * 0.75;
        this.angle += this.spin;
        this.flip += this.flipSpeed;

        if (this.y > height + 25 || this.x < -30 || this.x > width + 30) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.angle * Math.PI) / 180);
        ctx.scale(1, Math.sin(this.flip));

        ctx.beginPath();
        ctx.moveTo(0, -this.length / 2);
        ctx.bezierCurveTo(this.width, -this.length / 4, this.width, this.length / 3, 0, this.length / 2);
        ctx.bezierCurveTo(-this.width, this.length / 3, -this.width, -this.length / 4, 0, -this.length / 2);
        
        ctx.fillStyle = this.color + this.alpha + ')';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
        ctx.shadowBlur = 5;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < petalCount; i++) {
      petals.push(new Petal());
    }

    function animateSakura() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animateSakura);
    }

    animateSakura();
  </script>
</body>
</html>
